<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shorten a link</title>
  <meta name="description" content="Paste a long link and get a short one. Built with Node.js, Express, MongoDB and Redis." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #e9eef4;
      --surface: #ffffff;
      --ink: #14213d;
      --muted: #55627a;
      --line: #c9d3e0;
      --accent: #2f5bea;
      --accent-ink: #ffffff;
      --ok: #1e7f52;
      --err: #b4361a;
      --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #0f1a30;
        --surface: #17243f;
        --ink: #e8eef8;
        --muted: #9fb0cc;
        --line: #2c3d60;
        --accent: #7d9bff;
        --accent-ink: #0f1a30;
        --ok: #5fd39c;
        --err: #ff9b80;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      font-size: 1.0625rem;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
    }

    main {
      width: 100%;
      max-width: 40rem;
      margin: 0 auto;
      padding: 12vh 1.5rem 3rem;
      flex: 1;
    }

    h1 {
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(2.6rem, 8vw, 4.25rem);
      line-height: 0.98;
      letter-spacing: -0.03em;
      margin: 0 0 1rem;
    }
    .lede { color: var(--muted); margin: 0 0 2.5rem; max-width: 32rem; }

    form { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    .field { flex: 1 1 18rem; }
    input {
      width: 100%;
      font: inherit;
      color: var(--ink);
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 0.85rem 1rem;
    }
    input:focus { outline: none; border-color: var(--accent); }
    button {
      font: inherit;
      font-weight: 600;
      border: 0;
      border-radius: 10px;
      padding: 0.85rem 1.4rem;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-ink);
    }
    button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    button[disabled] { opacity: 0.6; cursor: progress; }
    .actions { display: flex; align-items: flex-end; }

    #status { min-height: 1.5rem; margin-top: 1rem; }
    .error { color: var(--err); font-weight: 500; }

    .result { margin-top: 2.5rem; padding-top: 2rem; border-top: 2px solid var(--line); }
    .result[hidden] { display: none; }
    .short {
      display: block;
      font-family: var(--display);
      font-weight: 800;
      font-size: clamp(1.4rem, 5.5vw, 2.4rem);
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
      text-decoration: none;
      overflow-wrap: anywhere;
    }
    .short:hover { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; }
    .row { display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; margin-top: 1.25rem; }
    .secondary {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--line);
      padding: 0.6rem 1.1rem;
    }
    .copied { color: var(--ok); font-weight: 600; }
    .meta { color: var(--muted); font-size: 0.95rem; margin: 1.25rem 0 0; }
    .original { overflow-wrap: anywhere; }

    /* The one moment of motion: the long link visibly shrinks into the short one */
    @media (prefers-reduced-motion: no-preference) {
      .result.reveal .short { animation: settle 520ms cubic-bezier(.2,.8,.2,1) both; }
      @keyframes settle {
        from { letter-spacing: 0.25em; opacity: 0; }
        to { letter-spacing: -0.02em; opacity: 1; }
      }
    }

    footer {
      max-width: 40rem;
      width: 100%;
      margin: 0 auto;
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Make long links short.</h1>
    <p class="lede">Paste any web address and get a short link you can share anywhere. Opening it takes people straight to the original page.</p>

    <form id="form" novalidate>
      <div class="field">
        <label for="url">Your link</label>
        <input id="url" name="url" type="text" inputmode="url" autocomplete="off"
               placeholder="https://example.com/a/very/long/page" required />
      </div>
      <div class="actions">
        <button id="submit" type="submit">Shorten link</button>
      </div>
    </form>

    <div id="status" role="status" aria-live="polite"></div>

    <section id="result" class="result" hidden aria-live="polite">
      <a id="short" class="short" href="#" target="_blank" rel="noopener"></a>
      <div class="row">
        <button id="copy" class="secondary" type="button">Copy link</button>
        <span id="copied" class="copied" hidden>Copied</span>
      </div>
      <p class="meta" id="saving"></p>
      <p class="meta original" id="original"></p>
      <p class="meta" id="quota"></p>
    </section>
  </main>

  <footer>
    Built with Node.js, Express, MongoDB and Redis, with caching and per-user rate limiting.
    <a href="https://github.com/Shrmi1709/url-shortener" target="_blank" rel="noopener">Source on GitHub</a>
  </footer>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('url');
    const submit = document.getElementById('submit');
    const statusEl = document.getElementById('status');
    const result = document.getElementById('result');
    const shortEl = document.getElementById('short');
    const copyBtn = document.getElementById('copy');
    const copiedEl = document.getElementById('copied');
    const savingEl = document.getElementById('saving');
    const originalEl = document.getElementById('original');
    const quotaEl = document.getElementById('quota');

    function showError(message) {
      statusEl.innerHTML = '';
      const p = document.createElement('span');
      p.className = 'error';
      p.textContent = message;
      statusEl.appendChild(p);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      let url = input.value.trim();
      if (!url) {
        showError('Paste a link to shorten, like https://example.com.');
        input.focus();
        return;
      }
      // Let people paste "google.com" without typing https://
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      submit.disabled = true;
      submit.textContent = 'Shortening…';
      statusEl.textContent = '';

      try {
        const res = await fetch('/api/shorten', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url }),
        });
        const data = await res.json().catch(() => ({}));

        if (res.status === 429) {
          const wait = data.retryAfterSeconds || res.headers.get('Retry-After') || 60;
          showError(`You've made 10 links in the last minute. You can make another in ${wait} seconds.`);
          return;
        }
        if (res.status === 400) {
          showError("That doesn't look like a web address. Check the link and try again.");
          return;
        }
        if (!res.ok) {
          showError('The link could not be shortened right now. Try again in a moment.');
          return;
        }

        shortEl.textContent = data.shortUrl.replace(/^https?:\/\//, '');
        shortEl.href = data.shortUrl;
        originalEl.textContent = 'Opens ' + data.originalUrl;
        const saved = data.originalUrl.length - data.shortUrl.length;
        savingEl.textContent = saved > 0
          ? `${data.originalUrl.length} characters down to ${data.shortUrl.length}.`
          : '';

        const left = res.headers.get('X-RateLimit-Remaining');
        const limit = res.headers.get('X-RateLimit-Limit');
        quotaEl.textContent = left !== null && limit !== null
          ? `${left} of ${limit} links left this minute.`
          : '';

        copiedEl.hidden = true;
        result.hidden = false;
        result.classList.remove('reveal');
        void result.offsetWidth; // restart the animation
        result.classList.add('reveal');
        input.value = '';
      } catch {
        showError('Could not reach the server. Check your connection and try again.');
      } finally {
        submit.disabled = false;
        submit.textContent = 'Shorten link';
      }
    });

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(shortEl.href);
      } catch {
        const temp = document.createElement('textarea');
        temp.value = shortEl.href;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        temp.remove();
      }
      copiedEl.hidden = false;
    });
  </script>
</body>
</html>
